<!doctype html><html lang="ru"><head><style>
*{box-sizing:border-box}body{margin:0;padding:0;background:#000;color:#f5f5f7;font-family:system-ui,sans-serif;font-size:14px;line-height:1.35}main{padding:22px 22px 16px;border-radius:28px;background:#000}h1,h2,p{margin:0}h1{font-size:27px;line-height:1.15;font-weight:700;margin:8px 0}h2{font-size:20px;line-height:1.2}.muted{color:#99999f;font-size:12px}.accent{color:#b5f56b}.top,.meta,.row,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#1d1d1f;border-radius:24px;padding:6px 15px;font-size:12px;white-space:nowrap}.year{font-size:14px;color:#99999f;font-weight:400;margin-left:5px}.meta{font-size:12px;margin:12px 0 8px}.track{display:flex;gap:4px;margin-bottom:14px}.track span{height:3px;flex:1;border-radius:4px;background:var(--c)}.lesson{display:flex;gap:12px;margin:12px 0;padding-left:9px;border-left:3px solid var(--c);cursor:pointer}.times{width:50px;flex-shrink:0}.times b{font-size:17px}.times small{display:block;color:#99999f;font-size:11px;margin-top:3px}.number{font-size:10px;color:var(--c);margin-top:6px}.info{flex:1;min-width:0;padding-bottom:12px;border-bottom:1px solid #252527}.info h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teacher{margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room{margin-top:5px;font-size:12px;color:var(--c)}.kind{font-size:10px;color:var(--c);padding:4px 9px;border-radius:10px;background:#1d1d1f;flex-shrink:0}.near{padding:0 0 14px;margin-bottom:16px;border-bottom:1px solid #252527}.near .clock{font-size:34px;font-weight:700;letter-spacing:-1px;margin:6px 0}.near .clock small{font-size:14px;font-weight:400;letter-spacing:0;color:#99999f}.near h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.near .muted{margin-top:5px}.select h1{margin:12px 0}.select .muted{margin-bottom:22px}.buttons{display:flex;gap:7px;margin-top:8px}.buttons button{flex:1;min-width:0}.choices{flex-wrap:wrap}.choices button{flex:1 1 28%}button{background:#1d1d1f;color:#f5f5f7;border:0;border-radius:14px;padding:12px 8px;font:inherit;font-size:12px;line-height:1.25;cursor:pointer;min-height:44px}button:active{opacity:.65}button:disabled{opacity:.45}.primary{background:#b5f56b;color:#152009;font-weight:600}.change{background:#1c2b13;color:#b5f56b}.page{text-align:center;font-size:10px;color:#99999f;margin:7px 0}.foot{font-size:10px;color:#717178;margin-top:12px}.empty{padding:26px 0}.detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5;margin:15px 0}.status{font-size:11px;color:#b5f56b;margin-top:7px;min-height:15px}@media(max-width:340px){main{padding:18px 20px 12px}h1{font-size:24px}.near .clock{font-size:28px}.lesson{gap:8px}.info h2{font-size:15px}button{font-size:11px;padding:11px 5px}}
</style></head><body><main id="app"></main><script>
const W=window.TelegramWidget,A=document.getElementById('app'),colors=['#b5f56b','#76b8ff','#bd9aff','#ffcd66'];let state=null,busy=false,timer=null,nearMode=false;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=text;if(cls)n.className=cls;return n}
function add(parent,tag,text,cls){const n=el(tag,text,cls);parent.appendChild(n);return n}
function tint(n,num){n.style.setProperty('--c',colors[((num||1)-1)%4]);return n}
function request(key){if(!W||busy)return;busy=true;setDisabled(true);status('Загружаю…');timer=setTimeout(()=>{busy=false;setDisabled(false);status('Не удалось обновить. Нажми ещё раз.')},24000);W.request(key).then(a=>{if(a.result){const r=JSON.parse(a.result);if(r.error){clearTimeout(timer);busy=false;setDisabled(false);status(r.error)}}},()=>{clearTimeout(timer);busy=false;setDisabled(false);status('Не удалось обновить. Нажми ещё раз.')})}
function status(text){const n=document.getElementById('status');if(n)n.textContent=text}
function setDisabled(value){A.querySelectorAll('button').forEach(b=>b.disabled=value)}
function button(parent,label,key,cls){const b=add(parent,'button',label,cls);b.addEventListener('click',()=>request(key));return b}
function detail(l){A.innerHTML='';add(A,'p','ПАРА '+l[0]+' · '+l[1]+' — '+l[2],'accent');add(A,'div',[l[3],l[6],l[4],l[5]?'Аудитория '+l[5]:'',l[7]?'Группы: '+l[7]:''].filter(Boolean).join('\n\n'),'detail');const b=add(A,'button','← К расписанию','primary');b.addEventListener('click',draw)}
function draw(){if(!state)return;clearTimeout(timer);busy=false;A.innerHTML='';const s=state;
if(s.v==='day'){
 if(nearMode&&s.next){const n=add(A,'section',null,'near');const top=add(n,'div',null,'top');add(top,'span','Ближайшая пара','accent');add(top,'span',s.g,'pill');const clock=add(n,'div',null,'clock');add(clock,'span',s.next[0]);add(clock,'small',' — '+s.next[1]);add(n,'h2',s.next[2]);add(n,'p',s.next[3]?'Аудитория '+s.next[3]:'Расписание выбранного дня','muted');add(n,'p',s.d+' · '+s.w,'muted');const back=add(A,'button','Расписание на день','primary');back.addEventListener('click',()=>{nearMode=false;draw()})}else{
 const top=add(A,'div',null,'top');add(top,'span',s.w,'accent');if(s.next){const tab=add(top,'button','Ближайшая →','pill');tab.style.minHeight='0';tab.addEventListener('click',()=>{nearMode=true;draw()})}else add(top,'span',s.g,'pill');const title=add(A,'h1',s.d);add(title,'span',s.y,'year');const meta=add(A,'div',null,'meta');add(meta,'span',s.n+' '+(s.n===1?'пара':s.n>1&&s.n<5?'пары':'пар')+' · '+s.g);add(meta,'span',s.range,'muted');const track=add(A,'div',null,'track');for(let i=0;i<s.n;i++)tint(add(track,'span'),i+1);
 if(!s.l.length){add(A,'h2','Можно выдохнуть.','empty');add(A,'p','В этот день занятий нет.','muted')}
 s.l.forEach(l=>{const row=tint(add(A,'article',null,'lesson'),l[0]);row.addEventListener('click',()=>detail(l));const t=add(row,'div',null,'times');add(t,'b',l[1]);add(t,'small',l[2]);add(t,'div',l[0]+' пара','number');const info=add(row,'div',null,'info');const heading=add(info,'div',null,'row');add(heading,'h2',l[3]||'Продолжение');if(l[6])add(heading,'span',l[6],'kind');if(l[4])add(info,'p',l[4],'teacher muted');if(l[5])add(info,'p','Аудитория '+l[5],'room');if(l[7])add(info,'p',l[7],'teacher muted')});if(s.p)add(A,'p','Страница '+s.p+' · нажми на пару для подробностей','page');}
}else{A.className='select';add(A,'p','ТВОЁ РАСПИСАНИЕ','muted');add(A,'h1',s.title);add(A,'p',s.note,'muted')}
 if(s.v==='day')A.className='';
 let chosen=null,selected=null,confirm=null;(s.b||[]).forEach(row=>{const wrap=add(A,'div',null,'buttons'+(s.v==='select'?' choices':''));row.forEach(([label,key,kind])=>{if(kind==='group'){const b=add(wrap,'button',label);b.addEventListener('click',()=>{if(selected)selected.className='';selected=b;b.className='primary';chosen=key;confirm.disabled=false})}else button(wrap,label.replace('🔄 ',''),key,label.includes('Сменить')?'change':'')})});if((s.b||[]).some(row=>row.some(b=>b[2]==='group'))){const wrap=add(A,'div',null,'buttons');confirm=add(wrap,'button','Показать расписание','primary');confirm.disabled=true;confirm.addEventListener('click',()=>{if(chosen)request(chosen)})}
 const st=add(A,'p','','status');st.id='status';add(A,'p','ФГУ / РАСПИСАНИЕ','foot');if(W)W.ready();
}
function load(){try{state=JSON.parse((W.chatData||'')+(W.publicData||''));draw()}catch(e){if(!state){add(A,'p','Открой бота и отправь /start.','muted')}}}
if(W){W.onEvent('chatDataChanged',load);W.onEvent('publicDataChanged',load);load()}else{add(A,'p','Виджет расписания открывается в Telegram.','muted')}
</script></body></html>
